[project]
name = "mining"
version = "0.1.0"
description = "Data mining tutorials with curated datasets and optimized notebooks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.8",
    "mlxtend>=0.23",
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.42.1",
    "scikit-learn>=1.4",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

[tool.ruff]
extend-exclude = ["*.ipynb"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.setuptools]
py-modules = []
